<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Personal Blog</h1>
    </header>
    
    <main>
        <section>
            <h2>Add New Post</h2>
            <form id="new-post-form" novalidate>
                <div class="input-container">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" maxlength="100"  required>
                    <span id="title-error" class="error-message"></span>
                </div>

                <div class="input-container">
                    <label for="content">Write Your Post</label>
                    <textarea name="content" id="content" rows="5" required></textarea>
                    <span id="content-error" class="error-message"></span>
                </div>

                <button type="submit" id="add-post-btn">Add Post</button>
            </form>
        </section>

        <section class="posts">
            <h2>My Post</h2>
            <div id="post-container"></div>
            <!-- No post meassage: I want JS to show or hide this based on if there are any post or not-->
            <p id="no-post-message">No post yet. Write your first post above</p>
        </section>
    </main>

    
</body>
</html>
