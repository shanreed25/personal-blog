<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Blog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Personal Blog</h1>
    </header>
    
    <main>
        <section>
            <h2>Add New Post</h2>
            <form>

                <div class="input-container">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title"  required>
                    <span id="title-error"></span>
                </div>

                <div class="input-container">
                    <label for="content">Write Your Post</label>
                    <textarea name="content" id="content" rows="5" required></textarea>
                    <span id="title-error"></span>
                </div>

                <button type="submit" id="add-btn">Add Post</button>
            </form>
        </section>

        <section class="posts">
            <h2>My Post</h2>
            <div id="post-container"></div>
            <!-- No post meassage: I want JS to show or hide this based on if there are any post or not-->
            <p id="no-post-message">No post yet. Write your first post above</p>
        </section>
    </main>

    
</body>
</html>
